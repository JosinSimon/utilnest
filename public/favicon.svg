<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">UtilNest</title>
  <desc id="desc">UtilNest dark rounded-square wind logo.</desc>
  <defs>
    <linearGradient id="bg" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="60%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="shine" x1="80" y1="64" x2="432" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Base Squircle -->
  <rect x="40" y="40" width="432" height="432" rx="104" fill="url(#bg)"/>
  <rect x="40" y="40" width="432" height="432" rx="104" fill="url(#shine)"/>
  <rect x="40" y="40" width="432" height="432" rx="104" fill="none" stroke="#3f3f46" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Centered Lucide Wind Icon with exact brand geometry -->
  <g transform="translate(122, 122) scale(11.16)" fill="none" stroke="#fafafa" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12.8 19.6A2 2 0 1 0 14 16H2"/>
    <path d="M17.5 8a2.5 2.5 0 1 1 2 4H2"/>
    <path d="M9.8 4.4A2 2 0 1 1 11 8H2"/>
  </g>
</svg>
